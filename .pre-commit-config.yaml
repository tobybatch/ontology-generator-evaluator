default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Ruff Linter & Formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Validate commit messages against the project's Commitizen schema.
  - repo: local
    hooks:
      - id: commitizen
        name: commitizen
        entry: uv run --no-sync cz check --commit-msg-file
        language: system
        stages: [commit-msg]