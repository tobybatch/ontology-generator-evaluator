[project]
name = "ontology-genrator-evaluator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Toby Batch", email = "tobias@neontribe.co.uk" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-wtf>=1.3.0",
    "govuk-frontend-jinja>=4.1.0",
    "govuk-frontend-wtf>=3.2.0",
    "jinja2>=3.1.6",
]

[project.scripts]
ontology-genrator-evaluator = "ontology_genrator_evaluator:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
